name: Build & Release

# - every push / pull request : build Windows + Linux and run the headless bot match test
# - pushing a tag "vX.Y.Z"     : additionally publishes a GitHub Release with the zips
#                                (the launcher picks it up automatically)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev zip

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "AXIOM_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "AXIOM_VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"
          else
            echo "AXIOM_VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAXIOM_VERSION="$AXIOM_VERSION" -DAXIOM_REPO="${{ github.repository }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Headless bot match (simulation test)
        shell: bash
        run: |
          BIN=build/AxiomSimTest
          [ -f build/Release/AxiomSimTest.exe ] && BIN=build/Release/AxiomSimTest.exe
          "$BIN" 2 2 | tail -15

      - name: Package
        shell: bash
        run: |
          OUT=dist/AXIOM
          mkdir -p "$OUT/game"
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp build/Release/AxiomLauncher.exe "$OUT/"
            cp build/Release/AxiomGame.exe build/Release/AxiomServer.exe "$OUT/game/"
          else
            cp build/AxiomLauncher "$OUT/"
            cp build/AxiomGame build/AxiomServer "$OUT/game/"
            chmod +x "$OUT/AxiomLauncher" "$OUT/game/AxiomGame" "$OUT/game/AxiomServer"
          fi
          echo "$AXIOM_VERSION" > "$OUT/game/version.txt"
          printf "repo=%s\nclose_on_play=1\n" "${{ github.repository }}" > "$OUT/launcher.ini"
          cp README.md "$OUT/README.md"
          cp assets/fonts/OFL.txt "$OUT/game/FONT-LICENSE.txt"
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip "../AXIOM-${{ matrix.platform }}.zip" AXIOM > /dev/null
          else
            zip -qr "../AXIOM-${{ matrix.platform }}.zip" AXIOM
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AXIOM-${{ matrix.platform }}
          path: AXIOM-${{ matrix.platform }}.zip

  # Publishes automatically: on a "v*" tag, or on every push to main whose VERSION file
  # names a version that has no release yet (bump VERSION + push = new update for every launcher)
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(tr -d ' \r\n' < VERSION)"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "v$V" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Release v$V already exists - nothing to publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # take the matching section of CHANGELOG.md if present, otherwise a default text
          if [ -f CHANGELOG.md ] && grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            awk -v v="## [$VERSION]" 'index($0,v)==1{f=1;print;next} /^## \[/{if(f)exit} f' CHANGELOG.md > notes.md
          else
            echo "## AXIOM $VERSION" > notes.md
            echo "Mise a jour disponible via le launcher." >> notes.md
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AXIOM v${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: artifacts/*.zip
